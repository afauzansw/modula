name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Modula is never deployed, so CI provisions no database service. Local
    # development runs on PostgreSQL; the test suite runs against SQLite
    # in-memory here (Laravel migrations + the partial unique index both work
    # on SQLite too).
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install and build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Lint and static analysis
        run: |
          bun run lint:check
          bun run format:check
          bun run types:check
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: php artisan test
